<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌游规则卡片库 · 开局配件占用台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">聚会前快速复习</p>
          <h1>桌游规则遗忘点卡片库</h1>
        </div>
        <div class="summary">
          <div>
            <span>收藏</span>
            <strong id="gameCount">0</strong>
          </div>
          <div>
            <span>遗忘点</span>
            <strong id="ruleCount">0</strong>
          </div>
          <div>
            <span>最久未玩</span>
            <strong id="staleGame">-</strong>
          </div>
        </div>
      </header>

      <section class="controls">
        <label>
          搜索
          <input id="searchInput" type="search" placeholder="游戏名或规则关键词" />
        </label>
        <label>
          人数
          <select id="playerFilter">
            <option value="all">全部</option>
            <option value="2">适合2人</option>
            <option value="3">适合3人</option>
            <option value="4">适合4人</option>
            <option value="5">适合5人</option>
          </select>
        </label>
        <label>
          复杂度
          <select id="complexityFilter">
            <option value="all">全部</option>
            <option value="轻">轻</option>
            <option value="中">中</option>
            <option value="重">重</option>
          </select>
        </label>
        <label>
          排序
          <select id="sortMode">
            <option value="stale">最近未玩</option>
            <option value="name">名称</option>
            <option value="complexity">复杂度</option>
          </select>
        </label>
      </section>

      <section class="desk">
        <div class="panel-head">
          <div>
            <p class="eyebrow">开局登记</p>
            <h2>开局配件占用台</h2>
          </div>
          <div class="desk-summary" id="deskSummary"></div>
        </div>

        <div class="desk-grid">
          <form class="panel session-form" id="sessionForm">
            <h3>新开一局</h3>
            <label>
              游戏
              <select id="sessionGameSelect"></select>
            </label>
            <label>
              桌位
              <select id="sessionTableSelect"></select>
            </label>
            <div>
              <span class="form-caption">登记配件数量</span>
              <div id="sessionPartsRows" class="parts-rows"></div>
            </div>
            <p id="sessionTotal" class="session-total"></p>
            <div class="session-actions">
              <button class="primary" type="submit" id="openSessionBtn">开局占用</button>
              <button type="button" id="shortageBtn">缺件登记</button>
            </div>
            <p class="desk-message" id="sessionMessage" role="status"></p>
          </form>

          <section class="panel desk-board">
            <h3>桌位占用</h3>
            <div id="tableBoard" class="table-board"></div>
            <h3 class="pool-title">共用配件库存</h3>
            <div id="componentBoard" class="component-board"></div>
          </section>

          <section class="panel desk-sessions">
            <h3>未结束局</h3>
            <div id="sessionBoard" class="session-board"></div>
          </section>
        </div>

        <section class="panel history-panel">
          <div class="panel-head">
            <h3>历史局（已结束 / 已取消，占用已释放）</h3>
            <button type="button" id="clearHistoryBtn">清空历史</button>
          </div>
          <div id="historyBoard" class="history-board"></div>
        </section>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>新增桌游</h2>
          <form id="gameForm" class="game-form">
            <label>
              名称
              <input id="nameInput" required placeholder="例：勃艮第城堡" />
            </label>
            <div class="split">
              <label>
                最少人数
                <input id="minPlayersInput" type="number" min="1" max="12" value="2" required />
              </label>
              <label>
                最多人数
                <input id="maxPlayersInput" type="number" min="1" max="12" value="4" required />
              </label>
            </div>
            <div class="split">
              <label>
                时长分钟
                <input id="durationInput" type="number" min="5" value="90" required />
              </label>
              <label>
                复杂度
                <select id="complexityInput">
                  <option value="轻">轻</option>
                  <option value="中" selected>中</option>
                  <option value="重">重</option>
                </select>
              </label>
            </div>
            <label>
              上次游玩
              <input id="lastPlayedInput" type="date" required />
            </label>
            <label>
              封面图
              <input id="coverInput" type="file" accept="image/*" />
            </label>
            <button class="primary" type="submit">加入收藏</button>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="panel-head">
            <h2>收藏列表</h2>
            <span id="visibleCount"></span>
          </div>
          <div id="gameList" class="game-list"></div>
        </section>

        <aside class="panel detail-panel">
          <div id="detailView"></div>
        </aside>
      </section>
    </main>

    <script src="occupancy.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
